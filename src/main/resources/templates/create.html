<!DOCTYPE html>
 <html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{pl.edu.tpo_11.page.create.title}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/create" th:text="#{pl.edu.tpo_11.app.title}"></a>
            <div class="navbar-nav ms-auto">
                <div class="dropdown">
                    <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <span th:text="#{pl.edu.tpo_11.language.select}"></span>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/change-lang?lang=en">English</a></li>
                        <li><a class="dropdown-item" href="/change-lang?lang=pl">Polski</a></li>
                        <li><a class="dropdown-item" href="/change-lang?lang=de">Deutsch</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 th:text="#{pl.edu.tpo_11.page.create.header}"></h3>
                    </div>
                    <div class="card-body">
                        <div th:if="${param.success}" class="alert alert-success">
                            <span th:text="#{pl.edu.tpo_11.message.create.success}"></span>
                        </div>
                        <div th:if="${error}" class="alert alert-danger">
                            <span th:text="${error}">Error occurred</span>
                        </div>

                        <form th:action="@{/create}" th:object="${link}" method="post">
                            <div class="mb-3">
                                <label for="name" class="form-label" th:text="#{pl.edu.tpo_11.field.name}"></label>
                                <input id="name" type="text" class="form-control" th:field="*{name}"
                                       th:placeholder="#{pl.edu.tpo_11.field.name.placeholder}"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}">
                                    <span th:each="error : ${#fields.errors('name')}" th:text="${error}"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="targetUrl" class="form-label" th:text="#{pl.edu.tpo_11.field.url}"></label>
                                <input id="targetUrl" type="url" class="form-control" th:field="*{targetUrl}"
                                       th:placeholder="#{pl.edu.tpo_11.field.url.placeholder}"
                                       th:classappend="${#fields.hasErrors('targetUrl')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('targetUrl')}">
                                    <span th:each="error : ${#fields.errors('targetUrl')}" th:text="${error}"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label" th:text="#{pl.edu.tpo_11.field.password}"></label>
                                <input id="password" type="password" class="form-control" th:field="*{password}"
                                       th:placeholder="#{pl.edu.tpo_11.field.password.placeholder}"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}">
                                    <span th:each="error : ${#fields.errors('password')}" th:text="${error}"></span>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary" th:text="#{pl.edu.tpo_11.button.create}"></button>
                            <a href="/manage" class="btn btn-secondary" th:text="#{pl.edu.tpo_11.button.manage}"></a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
